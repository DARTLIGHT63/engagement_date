name: VK Post Monitor

on:
  schedule:
    # Запускать каждые 10 минут. Время в UTC.
    # Синтаксис cron: минута час день_месяца месяц день_недели
    # "*/10 * * * *" означает "каждые 10 минут".
    - cron: "*/10 * * * *"
  # Позволяет запустить workflow вручную из вкладки Actions для теста
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install vk_api requests

      - name: Run VK monitor script
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python vk_notifier.py

      - name: Commit and push state file
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add last_post_id.txt
          git diff --quiet && git diff --staged --quiet || git commit -m "Update last post ID"
          git push
